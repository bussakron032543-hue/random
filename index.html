<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสุ่มรายชื่อ สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body {
            background: radial-gradient(circle at center, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            color: #ffffff; margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        h1 {
            font-size: 26px; font-weight: 800; color: #fffb00; text-align: center;
            padding: 15px 25px; background: rgba(15, 23, 42, 0.85);
            border: 2px solid #ffeb3b; border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 235, 59, 0.5); margin-bottom: 20px;
        }
        .main-card {
            width: 100%; max-width: 450px; background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column; gap: 15px; text-align: center;
        }
        .big-screen {
            font-size: 45px; font-weight: 800; color: #fffb00;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); margin: 10px 0;
            word-break: break-word; min-height: 70px;
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; text-align: left; }
        label { font-size: 14px; color: #f1f5f9; font-weight: 600; }
        input[type="number"] {
            width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.9);
            color: #0f172a; border-radius: 10px; font-size: 16px; font-weight: 700; text-align: center; border: none; outline: none;
        }
        textarea {
            width: 100%; height: 100px; background: rgba(255, 255, 255, 0.9);
            color: #0f172a; border-radius: 10px; padding: 10px; font-size: 15px; resize: none; border: none; outline: none;
        }
        button {
            background: linear-gradient(135deg, #ff758c, #ff7eb3); color: #ffffff;
            border: none; padding: 14px; border-radius: 12px; font-size: 18px;
            font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <h1>สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</h1>

    <div class="main-card">
        <div style="font-size: 14px; color: #cbd5e1; font-weight: 600;">ผลการสุ่มล่าสุด</div>
        <div id="display" class="big-screen">พร้อมสุ่ม</div>

        <div class="input-group">
            <label>จำนวนรางวัล:</label>
            <input type="number" id="count" value="1" min="1">
        </div>
        <div class="input-group">
            <label>รายชื่อผู้มีสิทธิ์ (บรรทัดละ 1 ชื่อ):</label>
            <textarea id="list">สมชาย
สมหญิง
มานะ
ปิติ
ใจดี
วีระ
กิตติ
อนันต์
นภา</textarea>
        </div>
        <button type="button" onclick="startRandom()">🎯 สุ่มเลย!</button>
    </div>

<script>
    // เชื่อมต่อฐานข้อมูล Firebase ของคุณ
    const firebaseConfig = {
        databaseURL: "https://random-app-dce1h-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let isRunning = false;

    function startRandom() {
        if (isRunning) return;
        
        let textInput = document.getElementById('list');
        let text = textInput.value.trim();
        let names = text.split('\n').map(n => n.trim()).filter(n => n !== "");
        let num = parseInt(document.getElementById('count').value) || 1;

        if (names.length === 0) {
            alert("รายชื่อหมดแล้ว หรือยังไม่ได้กรอกรายชื่อ!");
            return;
        }
        if (num > names.length) {
            alert("จำนวนรางวัล (" + num + ") มากกว่ารายชื่อที่เหลืออยู่ (" + names.length + ")!");
            return;
        }

        isRunning = true;
        let display = document.getElementById('display');
        let i = 0;
        
        let timer = setInterval(() => {
            let tempShuffled = [...names].sort(() => 0.5 - Math.random());
            let tempArr = tempShuffled.slice(0, num);
            display.innerHTML = tempArr.join('<br>');
            i++;
            
            if (i > 20) {
                clearInterval(timer);
                let shuffled = [...names].sort(() => 0.5 - Math.random());
                let winners = shuffled.slice(0, num);
                
                let winnerText = winners.join('<br>');
                display.innerHTML = winnerText;

                // ส่งชื่อผู้ชนะขึ้นฐานข้อมูลคลาวด์
                database.ref('current_winner').set({
                    winnerName: winnerText,
                    timestamp: Date.now()
                });

                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

                let remainingNames = names.filter(n => !winners.includes(n));
                textInput.value = remainingNames.join('\n');
                isRunning = false;
            }
        }, 80);
    }
</script>

</body>
</html>
