<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสุ่มรายชื่อ สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body {
            background: radial-gradient(circle at center, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            background-size: 200% 200%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            margin: 0; padding: 20px;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        h1 {
            font-size: 24px; font-weight: 800; color: #fffb00; text-align: center;
            padding: 12px 20px; background: rgba(15, 23, 42, 0.85);
            border: 2px solid #ffeb3b; border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.5);
            margin-bottom: 20px; max-width: 100%;
        }
        /* จำลองหน้าจอมือถือสำหรับแสดงผล */
        .phone-wrapper {
            width: 100%; max-width: 340px; height: 320px;
            background: #1e293b; border: 8px solid #334155; border-radius: 30px;
            padding: 15px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px;
        }
        .phone-wrapper h3 { color: #38bdf8; font-size: 18px; margin: 0 0 10px 0; }
        .big-screen {
            font-size: 42px; font-weight: 800; color: #facc15;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            word-break: break-word; line-height: 1.2;
        }
        .winner-anim {
            animation: winnerPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #fffb00 !important;
        }
        @keyframes winnerPop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        /* แผงควบคุมและฟอร์ม */
        .control-panel {
            width: 100%; max-width: 400px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 14px; color: #f1f5f9; font-weight: 600; }
        input[type="number"] {
            width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.9);
            color: #0f172a; border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px; font-size: 16px; font-weight: 700; text-align: center; outline: none;
        }
        textarea {
            width: 100%; height: 90px; background: rgba(255, 255, 255, 0.9);
            color: #0f172a; border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px; border-radius: 10px; font-size: 14px; resize: none; outline: none;
        }
        button {
            background: linear-gradient(135deg, #ff758c, #ff7eb3); color: #ffffff;
            border: none; padding: 14px; border-radius: 12px; font-size: 18px;
            font-weight: 700; cursor: pointer; text-align: center;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h1>สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</h1>

    <!-- หน้าจอมือถือจำลองแสดงผลในตัว -->
    <div class="phone-wrapper">
        <h3>🏆 หน้าจอแสดงผลผู้โชคดี</h3>
        <div id="display" class="big-screen">พร้อมสุ่ม</div>
    </div>

    <!-- แผงควบคุมการสุ่ม -->
    <div class="control-panel">
        <div class="input-group">
            <label>จำนวนรางวัล:</label>
            <input type="number" id="count" value="1" min="1">
        </div>
        <div class="input-group">
            <label>รายชื่อผู้มีสิทธิ์ (บรรทัดละ 1 ชื่อ):</label>
            <textarea id="list">สมชาย
สมหญิง
มานะ
ปิติ
ใจดี
วีระ
กิตติ
อนันต์
นภา</textarea>
        </div>
        <button type="button" onclick="startRandom()">🎯 สุ่มเลย!</button>
    </div>

<script>
    let isRunning = false;
    const luckyWords = ["รวย!", "เฮง ๆ!", "ปัง ๆ!", "โชคดี!", "รับทรัพย์!"];

    function startRandom() {
        if (isRunning) return;
        
        let textInput = document.getElementById('list');
        let text = textInput.value.trim();
        let names = text.split('\n').map(n => n.trim()).filter(n => n !== "");
        let num = parseInt(document.getElementById('count').value) || 1;

        if (names.length === 0) {
            alert("รายชื่อหมดแล้ว หรือยังไม่ได้กรอกรายชื่อ!");
            return;
        }
        if (num > names.length) {
            alert("จำนวนรางวัล (" + num + ") มากกว่ารายชื่อที่เหลืออยู่ (" + names.length + ")!");
            return;
        }

        isRunning = true;
        let display = document.getElementById('display');
        display.classList.remove('winner-anim');
        let i = 0;
        
        let timer = setInterval(() => {
            let tempShuffled = [...names].sort(() => 0.5 - Math.random());
            let tempArr = tempShuffled.slice(0, num);
            display.innerHTML = tempArr.join('<br>');
            i++;
            
            if (i > 20) {
                clearInterval(timer);
                let shuffled = [...names].sort(() => 0.5 - Math.random());
                let winners = shuffled.slice(0, num);
                
                let winnerText = winners.join('<br>');
                display.innerHTML = winnerText;
                display.classList.add('winner-anim');

                confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });

                let remainingNames = names.filter(n => !winners.includes(n));
                textInput.value = remainingNames.join('\n');
                isRunning = false;
            }
        }, 80);
    }
</script>

</body>
</html>
