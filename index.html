<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสุ่มรายชื่อ สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</title>
    <!-- โหลดฟอนต์ Sarabun และไลบรารี Confetti -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- โหลด Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body {
            background: radial-gradient(circle at center, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            color: #ffffff; margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center; overflow: hidden;
        }
        .header-title { width: 100%; display: flex; justify-content: center; padding: 30px 20px 0 20px; z-index: 10; }
        .header-title h1 {
            margin: 0; font-size: 32px; font-weight: 800; color: #fffb00; text-align: center;
            padding: 12px 30px; background: rgba(15, 23, 42, 0.85);
            border: 3px solid #ffeb3b; border-radius: 20px;
            box-shadow: 0 0 25px rgba(255, 235, 59, 0.5); max-width: 90%;
        }
        .history-box {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 14px; border-radius: 14px; width: 200px; max-height: 160px;
            overflow-y: auto; backdrop-filter: blur(10px); z-index: 10;
        }
        .history-box h4 { margin: 0 0 6px 0; font-size: 13px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 4px; }
        #historyList { margin: 0; padding-left: 18px; font-size: 12px; color: #f8fafc; }
        .display-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; padding: 10px; }
        .big-screen {
            font-size: 65px; font-weight: 800; color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); text-align: center; line-height: 1.2; word-break: break-word;
        }
        .winner-anim {
            animation: winnerPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #fffb00 !important; text-shadow: 0 0 35px rgba(255, 251, 0, 0.8) !important;
        }
        @keyframes winnerPop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .qr-hint { margin-top: 10px; font-size: 14px; color: #ffeb3b; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        .bottom-panel {
            width: 100%; background: rgba(255, 255, 255, 0.2); border-top: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(16px); padding: 15px 25px; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10;
        }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; color: #f1f5f9; font-weight: 600; }
        input[type="number"] { width: 75px; padding: 8px; background: rgba(255,255,255,0.9); color: #0f172a; border-radius: 8px; font-size: 15px; font-weight: 700; text-align: center; border: none; outline: none; }
        textarea { width: 280px; height: 42px; background: rgba(255,255,255,0.9); color: #0f172a; padding: 6px 10px; border-radius: 8px; font-size: 13px; resize: none; border: none; outline: none; }
        button {
            background: linear-gradient(135deg, #ff758c, #ff7eb3); color: #ffffff; border: none;
            padding: 0 25px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; height: 42px;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.4); transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="header-title">
    <h1>รางวัลสมาชิกผู้เข้าร่วม สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</h1>
</div>

<div class="history-box">
    <h4>🏆 ได้รับรางวัลแล้ว</h4>
    <ul id="historyList">
        <li style="color: rgba(255,255,255,0.7); list-style: none;">ยังไม่มีผู้ได้รับรางวัล</li>
    </ul>
</div>

<div class="display-container">
    <div id="display" class="big-screen">พร้อมสุ่ม</div>
    <div class="qr-hint">📱 เปิดมือถือดูผลที่: phone.html</div>
</div>

<div class="bottom-panel">
    <div class="input-group">
        <label>จำนวนรางวัล:</label>
        <input type="number" id="count" value="1" min="1">
    </div>
    <div class="input-group">
        <label>รายชื่อผู้มีสิทธิ์ (บรรทัดละ 1 ชื่อ):</label>
        <textarea id="list">สมชาย
สมหญิง
มานะ
ปิติ
ใจดี
วีระ
กิตติ
อนันต์
นภา</textarea>
    </div>
    <button type="button" onclick="startRandom()">🎯 สุ่มเลย!</button>
</div>

<script>
    // ตั้งค่า Firebase Database
    const firebaseConfig = {
        databaseURL: "https://random-app-dce1h-default-rtdb.firebaseio.com/"
    };
    
    let database;
    try {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
    } catch (e) {
        console.log("Firebase Init Error: ", e);
    }

    let allWinners = [];
    let isRunning = false;
    const luckyWords = ["รวย!", "เฮง ๆ!", "ปัง ๆ!", "โชคดี!", "รับทรัพย์!"];

    function startRandom() {
        if (isRunning) return;
        
        let textInput = document.getElementById('list');
        let text = textInput.value.trim();
        let names = text.split('\n').map(n => n.trim()).filter(n => n !== "");
        let num = parseInt(document.getElementById('count').value) || 1;

        if (names.length === 0) {
            alert("รายชื่อหมดแล้ว หรือยังไม่ได้กรอกรายชื่อ!");
            return;
        }
        if (num > names.length) {
            alert("จำนวนรางวัล (" + num + ") มากกว่ารายชื่อที่เหลืออยู่ (" + names.length + ")!");
            return;
        }

        isRunning = true;
        let display = document.getElementById('display');
        display.classList.remove('winner-anim');
        let i = 0;
        
        let timer = setInterval(() => {
            let tempShuffled = [...names].sort(() => 0.5 - Math.random());
            let tempArr = tempShuffled.slice(0, num);
            
            if (Math.random() > 0.5 && num === 1) {
                let randomLucky = luckyWords[Math.floor(Math.random() * luckyWords.length)];
                display.innerHTML = tempArr[0] + "<br><span style='font-size: 30px; color: #ffeb3b;'>💰 " + randomLucky + " 💰</span>";
            } else {
                display.innerHTML = tempArr.join('<br>');
            }

            i++;
            if (i > 20) {
                clearInterval(timer);
                
                let shuffled = [...names].sort(() => 0.5 - Math.random());
                let winners = shuffled.slice(0, num);
                let winnerText = winners.join('<br>');
                
                display.innerHTML = winnerText;
                display.classList.add('winner-anim');

                // ส่งข้อมูลขึ้น Firebase
                if (database) {
                    database.ref('current_winner').set({
                        winnerName: winnerText,
                        timestamp: Date.now()
                    });
                }

                confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

                winners.forEach(w => allWinners.push(w));
                updateHistoryUI();

                let remainingNames = names.filter(n => !winners.includes(n));
                textInput.value = remainingNames.join('\n');
                isRunning = false;
            }
        }, 80);
    }

    function updateHistoryUI() {
        let historyList = document.getElementById('historyList');
        historyList.innerHTML = "";
        allWinners.forEach(winner => {
            let li = document.createElement('li');
            li.textContent = winner;
            historyList.appendChild(li);
        });
    }
</script>

</body>
</html>
