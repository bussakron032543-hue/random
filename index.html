    <div class="input-group">
        <label>🏆 ได้รับรางวัลแล้ว (<span id="winnerCount">0</span>):</label>
        <div class="history-box">
            <ul id="historyList">
                <li style="color: rgba(255,255,255,0.7); list-style: none; margin-left: -15px;">ยังไม่มีผู้ได้รับรางวัล</li>
            </ul>
        </div>
    </div>

    <button type="button" onclick="startRandom()">🎯 สุ่มเลย!</button>
</div>

<script>
    // 🔗 เชื่อมต่อ Firebase Realtime Database
    const firebaseConfig = {
        databaseURL: "https://random-app-dce1h-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let allWinners = [];
    let isRunning = false;
    const luckyWords = ["รวย!", "เฮง ๆ!", "ปัง ๆ!", "โชคดี!", "รับทรัพย์!"];
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    }

    function playWinSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, index) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + index * 0.08);
            osc.stop(audioCtx.currentTime + index * 0.08 + 0.3);
        });
    }

    function startRandom() {
        if (isRunning) return;
        
        let textInput = document.getElementById('list');
        let text = textInput.value.trim();
        let names = text.split('\n').map(n => n.trim()).filter(n => n !== "");
        let num = parseInt(document.getElementById('count').value) || 1;

        if (names.length === 0) { alert("รายชื่อหมดแล้ว!"); return; }
        if (num > names.length) { alert("จำนวนรางวัลมากกว่ารายชื่อที่มี!"); return; }

        isRunning = true;
        let display = document.getElementById('display');
        display.classList.remove('winner-anim');
        let i = 0;
        
        let timer = setInterval(() => {
            let tempShuffled = [...names].sort(() => 0.5 - Math.random());
            let tempArr = tempShuffled.slice(0, num);
            
            if (Math.random() > 0.5 && num === 1) {
                let randomLucky = luckyWords[Math.floor(Math.random() * luckyWords.length)];
                display.innerHTML = tempArr[0] + "<br><span style='font-size: clamp(24px, 3.5vw, 40px); color: #ffeb3b;'>💰 " + randomLucky + " 💰</span>";
            } else {
                display.innerHTML = tempArr.join('<br>');
            }

            playTickSound();
            i++;
            
            if (i > 22) {
                clearInterval(timer);
                
                let shuffled = [...names].sort(() => 0.5 - Math.random());
                let winners = shuffled.slice(0, num);
                let winnerText = winners.join('<br>');
                
                display.innerHTML = winnerText;
                display.classList.add('winner-anim');
                playWinSound();

                // 🚀 ส่งชื่อผู้โชคดีขึ้นไปบน Firebase ทันทีที่สุ่มเสร็จ
                database.ref('current_winner').set({
                    winnerName: winnerText,
                    timestamp: Date.now()
                }).then(() => {
                    console.log("Sync to Cloud Success!");
                }).catch((error) => {
                    console.error("Sync Failed: ", error);
                });

                confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

                winners.forEach(w => allWinners.push(w));
                updateHistoryUI();

                let remainingNames = names.filter(n => !winners.includes(n));
                textInput.value = remainingNames.join('\n');
                isRunning = false;
            }
        }, 80);
    }

    function updateHistoryUI() {
        let historyList = document.getElementById('historyList');
        let winnerCount = document.getElementById('winnerCount');
        winnerCount.textContent = allWinners.length;
        historyList.innerHTML = "";
        
        // แสดงรายชื่อผู้โชคดีล่าสุดไว้ด้านบนสุด
        [...allWinners].reverse().forEach((winner) => {
            let li = document.createElement('li');
            li.textContent = winner;
            historyList.appendChild(li);
        });
    }
</script>
