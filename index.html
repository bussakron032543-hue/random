<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบสุ่มรายชื่อ</title>
    <style>
        body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .container { text-align: center; margin-bottom: 30px; }
        button { padding: 12px 30px; font-size: 18px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0ea5e9; }
        .phone { width: 320px; height: 580px; background: #1e293b; border: 8px solid #334155; border-radius: 35px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        #result { font-size: 28px; font-weight: bold; color: #facc15; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>ระบบสุ่มรายชื่อผู้โชคดี</h1>
        <!-- เปลี่ยนคำว่า สุ่ม เลย เป็นปุ่มกดของคุณ หรือใช้ฟังก์ชันสุ่มเดิมของคุณได้เลย -->
        <button onclick="triggerRandom()">🎲 กดสุ่มรายชื่อ</button>
    </div>

    <!-- หน้าจอมือถือจำลองแสดงผลในหน้าเดียวกัน -->
    <div class="phone">
        <h3 style="color: #38bdf8; margin: 0;">🏆 หน้าจอมือถือจำลอง</h3>
        <div id="result">รอดำเนินการ...</div>
    </div>

    <script>
        // รายชื่อตัวอย่าง (สามารถปรับเปลี่ยนเป็นรายชื่อของคุณได้)
        const names = ["สมชาย", "ปิติ", "มานะ", "ใจดี", "สมหญิง", "วิระ"];

        function triggerRandom() {
            // สุ่มชื่อจากรายการ
            const randomIndex = Math.floor(Math.random() * names.length);
            const winner = names[randomIndex];

            // แสดงผลที่หน้าจอมือถือจำลองทันทีในหน้าเดียวกัน
            document.getElementById('result').innerText = winner;
        }
    </script>

</body>
</html>
