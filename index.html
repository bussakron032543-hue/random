<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุ่มรายชื่อพร้อมเสียง</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            width: 350px;
        }
        h2 {
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            border-radius: 10px;
            border: none;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 16px;
            margin-bottom: 15px;
        }
        #result {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 50px;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎲 สุ่มรายชื่อ</h2>
        <p style="font-size: 14px; margin-bottom: 5px;">ใส่รายชื่อ (บรรทัดละ 1 ชื่อ):</p>
        <textarea id="nameList">สมชาย
สมหญิง
มานี
มานะ
ปิติ</textarea>
        
        <div id="result">พร้อมสุ่ม</div>
        
        <button onclick="startRandom()">สุ่มรายชื่อ</button>
    </div>

    <script>
        // ใช้ Web Audio API สร้างเสียงโดยไม่ต้องโหลดไฟล์ภายนอก
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq, type, duration) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // เสียงระหว่างกำลังหมุนสุ่ม
        function playTickSound() {
            playBeep(600, 'sine', 0.05);
        }

        // เสียงตอนได้ผู้โชคดี (เสียงตื่นเต้น)
        function playWinSound() {
            setTimeout(() => playBeep(440, 'triangle', 0.1), 0);
            setTimeout(() => playBeep(554.37, 'triangle', 0.1), 100);
            setTimeout(() => playBeep(659.25, 'triangle', 0.1), 200);
            setTimeout(() => playBeep(880, 'triangle', 0.3), 300);
        }

        function startRandom() {
            const rawText = document.getElementById('nameList').value;
            // แยกรายชื่อด้วยขึ้นบรรทัดใหม่ และกรองบรรทัดที่ว่างออก
            const names = rawText.split('\n').map(n => n.trim()).filter(n => n !== '');
            
            if (names.length === 0) {
                alert('กรุณาใส่รายชื่ออย่างน้อย 1 ชื่อ');
                return;
            }

            const resultDiv = document.getElementById('result');
            let counter = 0;
            let totalSteps = 20; // จำนวนครั้งที่จะสลับป่วนๆ ก่อนหยุด
            let speed = 50;

            function runAnimation() {
                // สุ่มแสดงชื่อคั่นระหว่างรอหยุด
                const randomIndex = Math.floor(Math.random() * names.length);
                resultDiv.innerText = names[randomIndex];
                
                playTickSound();
                counter++;

                if (counter < totalSteps) {
                    // ค่อยๆ หน่วงเวลาให้ช้าลงตอนใกล้จบ
                    speed += 10;
                    setTimeout(runAnimation, speed);
                } else {
                    // สุ่มชื่อจริงอันสุดท้าย
                    const finalIndex = Math.floor(Math.random() * names.length);
                    resultDiv.innerText = names[finalIndex];
                    playWinSound(); // เล่นเสียงประกาศผล
                }
            }

            runAnimation();
        }
    </script>

</body>
</html>
