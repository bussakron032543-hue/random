<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสุ่มรายชื่อ สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- โหลด Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        
        body {
            background: radial-gradient(circle at center, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            background-size: 200% 200%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ส่วนหัวข้อด้านบน */
        .header-title {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 15px 20px 0 20px;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-title h1 {
            margin: 0;
            font-size: clamp(20px, 2.2vw, 32px);
            font-weight: 800;
            color: #fffb00;
            text-align: center;
            padding: 8px 25px;
            background: rgba(15, 23, 42, 0.85);
            border: 3px solid #ffeb3b;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 235, 59, 0.6);
            max-width: 90%;
        }

        /* พื้นที่แสดงผลชื่อสุ่มตรงกลาง */
        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 10px;
        }

        .big-screen {
            font-size: clamp(48px, 6vw, 80px);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            text-align: center;
            line-height: 1.2;
            word-break: break-word;
            max-height: 55vh;
            overflow-y: auto;
        }

        .big-screen::-webkit-scrollbar { display: none; }

        .winner-anim {
            animation: winnerPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #fffb00 !important;
            text-shadow: 0 0 40px rgba(255, 251, 0, 0.9) !important;
        }

        @keyframes winnerPop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.12); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* แถบควบคุมด้านล่าง (รวมกล่องประวัติไว้ด้านล่างนี้ด้วย) */
        .bottom-panel {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(16px);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            z-index: 10;
            flex-shrink: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        label {
            font-size: 12px;
            color: #f1f5f9;
            font-weight: 600;
        }

        input[type="number"] {
            width: 70px;
            height: 40px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            border: none;
            outline: none;
        }

        /* ปรับช่องใส่รายชื่อให้เล็กลงตามต้องการ */
        textarea {
            width: 250px;
            height: 40px;
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            resize: none;
            border: none;
            outline: none;
        }

        /* กล่องประวัติผู้ได้รับรางวัล (ย้ายมาอยู่ข้างล่าง) */
        .history-box {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 10px;
            border-radius: 8px;
            width: 220px;
            height: 40px;
            overflow-y: auto;
            backdrop-filter: blur(8px);
        }

        .history-box h4 {
            margin: 0;
            font-size: 12px;
            color: #ffeb3b;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 2px;
        }

        #historyList {
            margin: 2px 0 0 0;
            padding-left: 15px;
            font-size: 12px;
            color: #f8fafc;
        }

        button {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #ffffff;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            height: 40px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="header-title">
    <h1>รางวัลสมาชิกผู้เข้าร่วม สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</h1>
</div>

<div class="display-container">
    <div id="display" class="big-screen">พร้อมสุ่ม</div>
</div>

<div class="bottom-panel">
    <div class="input-group">
        <label>จำนวน:</label>
        <input type="number" id="count" value="1" min="1">
    </div>
    
    <div class="input-group">
        <label>รายชื่อผู้มีสิทธิ์ (บรรทัดละ 1 ชื่อ):</label>
        <textarea id="list">สมชาย
สมหญิง
มานะ
ปิติ
ใจดี
วีระ
กิตติ
อนันต์
นภา</textarea>
    </div>

    <!-- กล่องประวัติผู้ได้รับรางวัลย้ายมาอยู่ตรงนี้ -->
    <div class="input-group">
        <label>🏆 ได้รับรางวัลแล้ว (<span id="winnerCount">0</span>):</label>
        <div class="history-box">
            <ul id="historyList">
                <li style="color: rgba(255,255,255,0.7); list-style: none; margin-left: -15px;">ยังไม่มีผู้ได้รับรางวัล</li>
            </ul>
        </div>
    </div>

    <button type="button" onclick="startRandom()">🎯 สุ่มเลย!</button>
</div>

<script>
    // 🔗 เชื่อมต่อ Firebase Realtime Database
    const firebaseConfig = {
        databaseURL: "https://random-app-dce1h-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let allWinners = [];
    let isRunning = false;
    const luckyWords = ["รวย!", "เฮง ๆ!", "ปัง ๆ!", "โชคดี!", "รับทรัพย์!"];
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    }

    function playWinSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, index) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + index * 0.08);
            osc.stop(audioCtx.currentTime + index * 0.08 + 0.3);
        });
    }

    function startRandom() {
        if (isRunning) return;
        
        let textInput = document.getElementById('list');
        let text = textInput.value.trim();
        let names = text.split('\n').map(n => n.trim()).filter(n => n !== "");
        let num = parseInt(document.getElementById('count').value) || 1;

        if (names.length === 0) { alert("รายชื่อหมดแล้ว!"); return; }
        if (num > names.length) { alert("จำนวนรางวัลมากกว่ารายชื่อที่มี!"); return; }

        isRunning = true;
        let display = document.getElementById('display');
        display.classList.remove('winner-anim');
        let i = 0;
        
        let timer = setInterval(() => {
            let tempShuffled = [...names].sort(() => 0.5 - Math.random());
            let tempArr = tempShuffled.slice(0, num);
            
            if (Math.random() > 0.5 && num === 1) {
                let randomLucky = luckyWords[Math.floor(Math.random() * luckyWords.length)];
                display.innerHTML = tempArr[0] + "<br><span style='font-size: clamp(24px, 3vw, 35px); color: #ffeb3b;'>💰 " + randomLucky + " 💰</span>";
            } else {
                display.innerHTML = tempArr.join('<br>');
            }

            playTickSound();
            i++;
            
            if (i > 22) {
                clearInterval(timer);
                
                let shuffled = [...names].sort(() => 0.5 - Math.random());
                let winners = shuffled.slice(0, num);
                let winnerText = winners.join('<br>');
                
                display.innerHTML = winnerText;
                display.classList.add('winner-anim');
                playWinSound();

                // 🚀 ส่งชื่อผู้โชคดีขึ้นไปบน Firebase ทันทีที่สุ่มเสร็จ
                database.ref('current_winner').set({
                    winnerName: winnerText,
                    timestamp: Date.now()
                }).then(() => {
                    console.log("Sync to Cloud Success!");
                }).catch((error) => {
                    console.error("Sync Failed: ", error);
                });

                confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

                winners.forEach(w => allWinners.push(w));
                updateHistoryUI();

                let remainingNames = names.filter(n => !winners.includes(n));
                textInput.value = remainingNames.join('\n');
                isRunning = false;
            }
        }, 80);
    }

    function updateHistoryUI() {
        let historyList = document.getElementById('historyList');
        let winnerCount = document.getElementById('winnerCount');
        winnerCount.textContent = allWinners.length;
        historyList.innerHTML = "";
        
        // แสดงรายชื่อผู้โชคดีล่าสุดไว้ด้านบนสุด
        [...allWinners].reverse().forEach((winner) => {
            let li = document.createElement('li');
            li.textContent = winner;
            historyList.appendChild(li);
        });
    }
</script>
</body>
</html>
