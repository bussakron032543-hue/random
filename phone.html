<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผู้โชคดี - สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .winner-container {
            text-align: center;
            padding: 20px;
            width: 100%;
        }
        .label-text {
            font-size: 24px;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #result {
            font-size: 55px;
            font-weight: 800;
            color: #facc15;
            line-height: 1.3;
            word-break: break-word;
            text-shadow: 0 4px 20px rgba(250, 204, 21, 0.4);
            animation: fadeInScale 0.5s ease-out;
        }
        @keyframes fadeInScale {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="winner-container">
        <div class="label-text">🏆 ผู้โชคดี 🏆</div>
        <div id="result">รอดำเนินการ...</div>
    </div>

    <script>
        // เชื่อมต่อช่องสัญญาณวิทยุชื่อเดียวกันกับหน้าเว็บหลัก
        const radioChannel = new BroadcastChannel('my_random_channel');

        // รับข้อมูลชื่อผู้โชคดีแล้วแสดงผลทันที
        radioChannel.onmessage = function (event) {
            let data = event.data;
            if (data.type === 'SEND_WINNER') {
                let resultDiv = document.getElementById('result');
                resultDiv.innerHTML = data.winnerName;
                
                // รีเซ็ตแอนิเมชันให้เล่นซ้ำทุกครั้งที่ชื่อใหม่เข้ามา
                resultDiv.style.animation = 'none';
                resultDiv.offsetHeight; /* trigger reflow */
                resultDiv.style.animation = 'fadeInScale 0.5s ease-out';
            }
        };
    </script>

</body>
</html>
