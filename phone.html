<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผู้โชคดี - สหกรณ์การเกษตรด่านมะขามเตี้ย จำกัด</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- โหลด Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }
        .label-text {
            font-size: 26px;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #result {
            font-size: 55px;
            font-weight: 800;
            color: #facc15;
            line-height: 1.3;
            word-break: break-word;
            text-shadow: 0 4px 20px rgba(250, 204, 21, 0.4);
            animation: fadeInScale 0.5s ease-out;
        }
        @keyframes fadeInScale {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="label-text">🏆 ผู้โชคดี 🏆</div>
    <div id="result">รอดำเนินการ...</div>

    <script>
        // 🔗 เชื่อมต่อฐานข้อมูล Firebase Realtime Database ชุดเดียวกับเว็บคอมพิวเตอร์
        const firebaseConfig = {
            databaseURL: "https://random-app-dce1h-default-rtdb.firebaseio.com/"
        };
        
        try {
            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

            // 📡 ดึงข้อมูลผู้โชคดีแบบ Realtime ข้ามอุปกรณ์ทันทีเมื่อมีการกดสุ่มจากคอมพิวเตอร์
            database.ref('current_winner').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.winnerName) {
                    let resultDiv = document.getElementById('result');
                    resultDiv.innerHTML = data.winnerName;
                    
                    // รีเซ็ตแอนิเมชันซูมเด้งตื่นเต้นทุกครั้งที่เปลี่ยนชื่อ
                    resultDiv.style.animation = 'none';
                    resultDiv.offsetHeight;
                    resultDiv.style.animation = 'fadeInScale 0.5s ease-out';
                }
            }, (error) => {
                console.error("Firebase Read Error: ", error);
            });
        } catch (e) {
            console.error("Firebase Init Error: ", e);
        }
    </script>

</body>
</html>
